# Project configuration for the Codex paper agent.
# Replace every REPLACE_ME before asking Codex to run the pipeline.

project_name: "REPLACE_ME_PROJECT_NAME"

paper:
  title: "REPLACE_ME_PAPER_TITLE"
  target_conference: "REPLACE_ME_TARGET_CONFERENCE"
  deadline: "REPLACE_ME_DEADLINE_WITH_TIMEZONE"
  page_limit: 9
  abstract_source: "docs/abstract.md"

research:
  topic_short_name: "REPLACE_ME_SHORT_TOPIC"
  topic_description: "REPLACE_ME_DETAILED_RESEARCH_TOPIC"
  primary_claim: "REPLACE_ME_MAIN_CLAIM_TO_TEST"
  domains:
    - "machine learning"
    - "REPLACE_ME_DOMAIN"
  core_contributions:
    - name: "REPLACE_ME_CONTRIBUTION_1"
      description: "REPLACE_ME"
    - name: "REPLACE_ME_CONTRIBUTION_2"
      description: "REPLACE_ME"
    - name: "REPLACE_ME_EMPIRICAL_CONTRIBUTION"
      description: "REPLACE_ME"

paths:
  source_repo: "REPLACE_ME_ABSOLUTE_OR_RELATIVE_PATH"
  docs_repo: "REPLACE_ME_ABSOLUTE_OR_RELATIVE_PATH"
  examples_repo: "REPLACE_ME_ABSOLUTE_OR_RELATIVE_PATH"
  latex_template: "paper/venue_template"
  paper_dir: "paper/mypaper"
  results_dir: "results"
  code_dir: "code"
  data_dir: "data"

input_documents:
  paper_idea: "docs/paper_idea.md"
  experiment_plan: "docs/experiment_plan.md"
  literature_questions: "docs/literature_and_questions.md"

constraints:
  min_references: 30
  reference_year_after: 2020
  min_experiment_conditions: 10
  max_research_loops: 2
  max_repair_attempts_per_stage: 3
  require_human_approval: true
  allow_sota_claims_without_gate: false
  allow_unverified_citations: false
  allow_synthetic_results: false

compute_budget:
  max_total_runtime_hours: 6
  max_single_run_minutes: 30
  pilot_required: true
  stop_at_budget_fraction: 0.8

submission:
  anonymous: true
  include_reproducibility_statement: false
  include_acknowledgements: false
